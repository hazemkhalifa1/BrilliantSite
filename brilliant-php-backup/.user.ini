; PHP-FPM / CGI (cPanel "MultiPHP" / LiteSpeed) per-directory settings.
; .htaccess `php_value` only works under mod_php; this file covers FastCGI hosts.
; Raising these fixes "Upload failed" when an image exceeds the host's default 2M limit.
upload_max_filesize = 16M
post_max_size = 32M
max_file_uploads = 20
max_input_vars = 3000
memory_limit = 128M
